name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Enforce static-file middleware boundary
        shell: bash
        run: |
          if grep -R -n -E '@hono/node-server/serve-static|(^|[^[:alnum:]_])serveStatic([^[:alnum:]_]|$)' src; then
            echo "::error::Unsupported static-file middleware detected. Remove the dependency-review exception before introducing it."
            exit 1
          fi
      - name: Review dependencies
        # actions/dependency-review-action v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          # Transitive through the MCP SDK. This toolkit does not use the affected middleware;
          # the preceding guard enforces that boundary.
          allow-ghsas: GHSA-frvp-7c67-39w9
